name: Build Reqable Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'README.md'
      - 'STATUS.md'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'README.md'
      - 'STATUS.md'
      - '.github/workflows/build.yml'

jobs:
  android-debug:
    if: ${{ hashFiles('source/parts/part-*.bin') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble and verify source archive
        run: |
          cat source/parts/part-*.bin > "$RUNNER_TEMP/reqable-bridge-source-v0.1.zip"
          echo "50e8eaff4491a78d71c2371f37ff7f3f2be16a6924b85c68aeef9ae826e824b9  $RUNNER_TEMP/reqable-bridge-source-v0.1.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/reqable-bridge-source"
          unzip -q "$RUNNER_TEMP/reqable-bridge-source-v0.1.zip" -d "$RUNNER_TEMP/reqable-bridge-source"
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        run: gradle -p "$RUNNER_TEMP/reqable-bridge-source/reqable-bridge/android" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reqable-bridge-debug-apk
          path: ${{ runner.temp }}/reqable-bridge-source/reqable-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-bridge-tests:
    if: ${{ hashFiles('source/parts/part-*.bin') != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and verify source archive
        shell: pwsh
        run: |
          $parts = Get-ChildItem -LiteralPath 'source/parts' -Filter 'part-*.bin' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 source archive segments." }
          $archive = Join-Path $env:RUNNER_TEMP 'reqable-bridge-source-v0.1.zip'
          $stream = [System.IO.File]::Create($archive)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $stream.Write($bytes, 0, $bytes.Length)
            }
          } finally { $stream.Dispose() }
          $expected = '50e8eaff4491a78d71c2371f37ff7f3f2be16a6924b85c68aeef9ae826e824b9'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source archive SHA-256 mismatch: $actual" }
          $destination = Join-Path $env:RUNNER_TEMP 'source'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
      - name: Compile and test Windows bridge
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\source\reqable-bridge\windows-bridge"
          python -m py_compile bridge.py desktop.py tests/test_bridge.py
          python -m unittest discover -s tests -v
