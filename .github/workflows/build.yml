name: Build Reqable Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'README.md'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'source/**'
      - 'README.md'
      - '.github/workflows/build.yml'

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble and verify source archive
        run: |
          cat source/parts/part-*.bin > "$RUNNER_TEMP/reqable-bridge-source-v0.1.zip"
          echo "50e8eaff4491a78d71c2371f37ff7f3f2be16a6924b85c68aeef9ae826e824b9  $RUNNER_TEMP/reqable-bridge-source-v0.1.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/reqable-bridge-source"
          unzip -q "$RUNNER_TEMP/reqable-bridge-source-v0.1.zip" -d "$RUNNER_TEMP/reqable-bridge-source"
      - name: Apply Compose import compatibility fix
        run: |
          python3 - "$RUNNER_TEMP/reqable-bridge-source/reqable-bridge/android/app/src/main/java/com/reqable/bridge/MainActivity.kt" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          source = path.read_text()
          source = source.replace("import androidx.compose.foundation.layout.weight\n", "")
          source = source.replace(
              "import androidx.compose.foundation.text.SelectionContainer",
              "import androidx.compose.foundation.text.selection.SelectionContainer",
          )
          if "import androidx.compose.foundation.layout.weight" in source:
              raise SystemExit("Compose weight import fix did not apply")
          if "import androidx.compose.foundation.text.selection.SelectionContainer" not in source:
              raise SystemExit("Compose SelectionContainer import fix did not apply")
          path.write_text(source)
          PY
      - name: Install Android SDK 35
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Assemble debug APK
        run: gradle -p "$RUNNER_TEMP/reqable-bridge-source/reqable-bridge/android" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: reqable-bridge-debug-apk
          path: ${{ runner.temp }}/reqable-bridge-source/reqable-bridge/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-bridge-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble, verify, and patch source archive
        shell: pwsh
        run: |
          & .\source\assemble.ps1 -Destination "$env:RUNNER_TEMP\source"
      - name: Compile and test Windows bridge
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\source\reqable-bridge\windows-bridge"
          python -m py_compile bridge.py desktop.py tests/test_bridge.py
          python -m unittest discover -s tests -v
